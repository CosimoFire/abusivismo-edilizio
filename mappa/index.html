<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abusivismo edilizio per regione – Radar QN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,700&display=swap">
<link rel="stylesheet" href="../assets/radar.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="../assets/radar.js"></script>
<style>.scale{display:flex;flex-direction:column;gap:4px;width:min(100%,280px);margin:0 0 8px}.scale__bar{height:10px;border-radius:2px}.scale__lab{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums}</style>
</head>
<body>
<main class="radar">
  <header>
    <h1 class="r-title">L'abusivismo edilizio in Italia</h1>
    <p class="r-sub">Abitazioni abusive ogni 100 autorizzate dai Comuni, per regione, 2022</p>
  </header>

  <figure class="r-chart" id="map">
    <p class="r-chart__head">Abitazioni abusive ogni 100 autorizzate</p>
    <div class="r-key" id="key" style="margin:0 0 6px"></div>
  </figure>

  <p class="r-note" id="note"></p>

  <footer class="r-foot">
    <span>Fonte: Istat, Indicatori Bes (Paesaggio e patrimonio culturale)</span>
    <span>Elaborazione Radar – QN</span>
  </footer>
</main>

<script>
(function () {
  var R = Radar, fmt = R.fmt;
  var f1 = function (v) { return fmt(v, 1); };

  Promise.all([R.loadCSV("../data/abusivismo-regioni.csv"), d3.json("../data/regioni-semplice.geojson")]).then(function (res) {
    var rows = res[0].map(function (r) {
      return { code: r["Codice"], name: r["Regione"], v: R.num(r["Abusivismo 2022"]), group: r["Valore riferito a"] };
    });
    var italia = rows.find(function (r) { return r.code === "00"; });
    var regs = rows.filter(function (r) { return r.code !== "00"; });
    var byCode = {}; regs.forEach(function (r) { byCode[r.code] = r; });
    var geo = res[1];
    var top = regs.slice().sort(function (a, b) { return b.v - a.v; });
    var south = regs.filter(function (r) { return +r.code >= 15; });
    var minSouth = d3.min(south, function (r) { return r.v; });
    var maxNorth = d3.max(regs.filter(function (r) { return +r.code <= 8; }), function (r) { return r.v; });

    d3.select("#note").text("Valori di Piemonte e Valle d'Aosta, Trentino-Alto Adige e Friuli-Venezia Giulia, Umbria e Marche, Abruzzo e Molise, Basilicata e Calabria sono riferiti all'insieme delle due regioni. L'Istat ha interrotto l'aggiornamento dell'indicatore dopo il 2022.");

    var host = document.getElementById("map");
    var tip = R.tooltip(host);
    var clear = function () {};
    R.dismissOutside(host, function () { tip.hide(); clear(); });

    var vmin = d3.min(regs, function (r) { return r.v; }), vmax = d3.max(regs, function (r) { return r.v; });
    var STEPS = ["--blue-5", "--blue-4", "--blue-3", "--blue-2", "--blue-1"];
    var color;
    function makeScale() {
      var cs = getComputedStyle(document.documentElement);
      var cols = STEPS.map(function (v) { return cs.getPropertyValue(v).trim(); });
      var dom = STEPS.map(function (v, i) { return vmin + (vmax - vmin) * i / (STEPS.length - 1); });
      color = d3.scaleLinear().domain(dom).range(cols).interpolate(d3.interpolateLab).clamp(true);
      d3.select("#key").html('<div class="scale"><div class="scale__bar" style="background:linear-gradient(to right,' + cols.join(",") + ')"></div><div class="scale__lab"><span>' + f1(vmin) + '</span><span>' + f1(vmax) + '</span></div></div>');
    }
    makeScale();
    new MutationObserver(function () { makeScale(); d3.selectAll("#map svg path").style("fill", function (d) { return color(byCode[d.properties.code].v); }); })
      .observe(document.documentElement, { attributes: true });

    var svg = d3.select(host).append("svg").attr("role", "img");
    svg.append("title").text("Mappa delle regioni italiane per abitazioni abusive ogni 100 autorizzate nel 2022. Il valore più alto è " + fmt(top[0].v, 1) + " in Basilicata e Calabria, il più basso " + fmt(d3.min(regs, function (r) { return r.v; }), 1) + " in Trentino-Alto Adige e Friuli-Venezia Giulia.");
    var g = svg.append("g");

    R.responsive(host, function (W, phase) {
      var H = Math.round(Math.min(W * 1.12, 640));
      svg.attr("width", W).attr("height", H).attr("viewBox", "0 0 " + W + " " + H);
      var proj = d3.geoMercator().fitExtent([[4, 4], [W - 4, H - 4]], geo);
      var path = d3.geoPath(proj);
      g.selectAll("*").remove();
      var shapes = g.selectAll("path").data(geo.features).join("path")
        .attr("d", path)
        .style("fill", function (d) { return color(byCode[d.properties.code].v); })
        .style("stroke", "var(--bg)").style("stroke-width", 1)
        .style("stroke-linejoin", "round")
        .style("transition", "opacity 120ms")
        .style("cursor", "pointer");
      R.enter(shapes, phase,
        function (s) { s.style("opacity", 0); },
        function (s) { s.style("opacity", 1); }, 0);
      shapes.each(function (d, i) { });
      if (phase === "play") shapes.transition().delay(function (d, i) { return i * 25; }).duration(R.DUR * 0.6).style("opacity", 1);

      clear = function () { shapes.style("opacity", 1); };
      shapes.on("pointermove pointerdown", function (ev, d) {
        var r = byCode[d.properties.code];
        shapes.style("opacity", function (s) { return s === d ? 1 : 0.28; });
        var pos = d3.pointer(ev, host);
        tip.show(R.tipHTML({
          title: r.name, value: f1(r.v), unit: "ogni 100 autorizzate",
          rows: [["Italia", f1(italia.v)]],
          note: r.group ? "Valore riferito a " + r.group + " insieme." : null
        }), pos[0], pos[1]);
      }).on("pointerleave", function (ev) { if (ev.pointerType === "mouse") { tip.hide(); clear(); } });
    });
  }).catch(function (e) { R.fail(document.getElementById("map"), e); });
})();
</script>
</body>
</html>
